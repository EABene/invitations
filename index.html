<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Eine Frage</title>

  <!-- Schriften von Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
/* =========================================================
   Design-Variablen (Farben, zentral an einer Stelle)
   Wenn du eine Farbe ändern willst, änderst du sie hier
   einmal und sie wird überall verwendet.
   ========================================================= */
:root{
  --bg:#ffffff;
  --ink:#141210;            /* Textfarbe (fast schwarz) */
  --ink-soft:#6a665f;       /* gedämpfter Text */
  --green:#c0566e;          /* Hauptakzent (aktuell Rosé) */
  --green-deep:#a4485c;     /* dunklere Variante für Hover */
  --green-line:rgba(192,86,110,.26);  /* dünne Linien/Rahmen */
  --rose:#c0566e;
  --gold:#cf9a4e;           /* Gold für die Schnörkel */
  --shadow:rgba(40,20,28,.16);
}

/* =========================================================
   Grund-Reset & Body
   ========================================================= */
*{box-sizing:border-box; margin:0; padding:0}
html{height:100%}

body{
  font-family:'Outfit',sans-serif;
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;            /* mobil: rechnet die Browserleisten mit ein */
  overflow-x:hidden;            /* nie seitlich wackeln; vertikal darf gescrollt werden */
  background:
    radial-gradient(700px 480px at 50% -8%, #fdf2f5, transparent 70%),
    var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 14px;            /* etwas Luft zum Rand, falls gescrollt werden muss */
  position:relative;
  -webkit-tap-highlight-color:transparent;   /* kein grauer Blitz beim Tippen */
}

/* =========================================================
   Hintergrund-Herzen & Konfetti
   ========================================================= */
#bgHearts{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
.floaty{position:absolute; bottom:-50px; opacity:.2; animation:rise linear infinite; user-select:none;}
.floaty svg{display:block;}
@keyframes rise{
  0%{transform:translateY(0) rotate(-10deg); opacity:0}
  12%{opacity:.24}
  50%{opacity:.24}
  100%{transform:translateY(-114vh) rotate(12deg); opacity:0}
}
/* Eigene, beschnittene Ebene fürs Konfetti -> erzeugt keine Scrollbalken */
#fx{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:9998;}
.confetti{position:absolute; pointer-events:none;}
.confetti svg{display:block;}

/* =========================================================
   Karte (der weiße Kasten in der Mitte)
   ========================================================= */
.stage{position:relative; z-index:2; width:min(92vw, 540px); text-align:center;}

.card{
  background:#fff;
  border:1px solid var(--green-line);
  border-radius:6px;
  padding:50px 46px 46px;
  box-shadow:0 26px 60px -30px var(--shadow);
  position:relative;
}
/* zweite, innere Rahmenlinie -> klassischer Einladungs-Look */
.card::after{
  content:"";
  position:absolute;
  inset:9px;
  border:1px solid var(--green-line);
  border-radius:3px;
  pointer-events:none;
}

/* =========================================================
   Typografie & Ornamente
   ========================================================= */
.flourish{color:var(--gold); margin:0 auto 16px; display:block;}

.eyebrow{
  font-size:11px; letter-spacing:.4em; text-transform:uppercase;
  color:var(--green); font-weight:600; margin-bottom:12px;
}

h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-size:clamp(32px, 6.2vw, 48px);
  line-height:1.08;
  letter-spacing:.005em;
  margin-bottom:30px;
}
h1 .accent{color:var(--green); font-style:italic; font-weight:500;}

.sub{color:var(--ink-soft); font-size:15px; max-width:36ch; margin:-18px auto 26px; line-height:1.55;}

/* =========================================================
   Buttons (Ja / Nein)
   ========================================================= */
.btn-row{display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap;}

.btn{
  font-family:'Outfit',sans-serif; font-weight:500; font-size:16px;
  border:none; cursor:pointer; border-radius:7px; padding:14px 32px;
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
}
.btn-yes{color:#fff; background:var(--green); box-shadow:0 10px 22px -12px rgba(164,72,92,.75); display:inline-flex; align-items:center; gap:9px;}
.btn-yes:hover{background:var(--green-deep); transform:translateY(-2px);}
.btn-yes:active{transform:translateY(0);}
.btn-yes svg{width:15px;height:15px;}

.btn-no{
  color:var(--ink); background:#fff; border:1px solid var(--ink);
  /* "left" und "top" sind animiert -> der Knopf gleitet sanft weg */
  transition:left .45s cubic-bezier(.34,1.1,.4,1), top .45s cubic-bezier(.34,1.1,.4,1), background .2s ease, color .2s ease;
}
.btn-no:hover{background:#141210; color:#fff;}

/* =========================================================
   Tätigkeits-Auswahl (die Kacheln)
   ========================================================= */
.options{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:8px;}
.chip{
  background:#fff; border:1px solid var(--green-line); border-radius:7px;
  padding:18px 16px; cursor:pointer; font-family:'Outfit',sans-serif;
  font-weight:500; font-size:15px; color:var(--ink);
  transition:border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
}
.chip:hover{border-color:var(--green); background:var(--green); color:#fff; transform:translateY(-2px);}
.chip:active{transform:translateY(0);}

/* =========================================================
   Kalender
   ========================================================= */
.calendar{max-width:330px; margin:0 auto;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-title{font-family:'Cormorant Garamond',serif; font-size:23px; font-weight:600; color:var(--ink);}
.cal-nav{
  width:36px; height:36px; border:1px solid var(--green-line); background:#fff;
  border-radius:7px; cursor:pointer; font-size:18px; color:var(--ink); line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:border-color .18s ease, color .18s ease;
}
.cal-nav:hover:not(:disabled){border-color:var(--green); color:var(--green);}
.cal-nav:disabled{opacity:.28; cursor:default;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-dow{margin-bottom:6px;}
.dow{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); text-align:center; padding:4px 0; font-weight:600;}
.day{
  aspect-ratio:1/1; border:1px solid transparent; background:#fff; border-radius:8px;
  cursor:pointer; font-family:'Outfit',sans-serif; font-size:14px; color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.day:hover:not(.disabled):not(.selected){border-color:var(--green);}
.day.selected{background:var(--green); color:#fff; font-weight:600;}
.day.today:not(.selected){box-shadow:inset 0 0 0 1.5px var(--green);}
.day.disabled{color:#cbc8c2; cursor:default;}
.day.blank{visibility:hidden; cursor:default;}

.cal-actions{margin-top:24px; display:flex; flex-direction:column; align-items:center; gap:14px;}
.anytime{
  background:none; border:none; color:var(--ink-soft); font-family:'Outfit',sans-serif;
  font-size:13px; cursor:pointer; border-bottom:1px solid var(--green-line);
  padding-bottom:2px; transition:color .2s ease, border-color .2s ease;
}
.anytime:hover{color:var(--green); border-color:var(--green);}

/* =========================================================
   Bestätigung & Hilfsklassen
   ========================================================= */
.hidden{display:none !important;}   /* blendet einen Screen komplett aus */

.fade-in{animation:fade .45s ease both;}   /* sanftes Einblenden */
@keyframes fade{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

.mark{width:52px; height:52px; margin:0 auto 20px; color:var(--green); animation:pop .55s cubic-bezier(.2,1.3,.4,1) both;}
.mark svg{width:52px; height:52px; animation:beat 1.6s ease-in-out infinite .5s;}
@keyframes pop{from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.12)}}

/* Zusammenfassung auf dem Abschluss-Screen */
.summary{
  margin:6px auto 22px; max-width:320px;
  border:1px solid var(--green-line); border-radius:10px;
  overflow:hidden; text-align:left;
}
.sum-row{display:flex; justify-content:space-between; gap:14px; padding:12px 16px; font-size:14px;}
.sum-row + .sum-row{border-top:1px solid var(--green-line);}
.sum-label{color:var(--ink-soft);}
.sum-val{color:var(--ink); font-weight:600; text-align:right;}

.done-actions{display:flex; flex-direction:column; align-items:center; gap:14px;}

.restart{
  margin-top:28px; background:none; border:none; color:var(--ink-soft);
  font-family:'Outfit',sans-serif; font-size:13px; cursor:pointer;
  border-bottom:1px solid var(--green-line); padding-bottom:2px;
  transition:color .2s ease, border-color .2s ease;
}
.restart:hover{color:var(--green); border-color:var(--green);}

/* =========================================================
   Smartphone-Feinschliff (Bildschirme bis 480px Breite)
   ========================================================= */
@media (max-width:480px){
  body{padding:16px 10px;}
  .card{padding:36px 20px 32px;}   /* weniger Innenabstand -> mehr Platz für Inhalt */
  .card::after{inset:7px;}
  h1{margin-bottom:24px;}
  .sub{margin:-14px auto 22px;}
  .options{gap:10px;}
  .chip{padding:16px 12px;}
  .calendar{max-width:none;}        /* Kalender nutzt die volle Breite -> größere Tippfelder */
  .day{font-size:15px;}
  .cal-actions{margin-top:20px;}
  .btn{padding:14px 26px;}
}

  </style>
</head>

  <script>
/* =========================================================
   date-frage – Verhalten / Logik
   Gliederung:
     0) Einstellungen (deine WhatsApp-Nummer)
     1) Hintergrund-Herzen
     2) Herz-Konfetti
     3) Der ausweichende "Nein"-Knopf
     4) Bildschirm-Wechsel (welcher Screen ist sichtbar)
     5) Ablauf: Ja -> Tätigkeit -> (Essen?) -> Kalender -> Bestätigung
     6) Kalender-Logik
     7) Abschluss: Zusammenfassung + Kopieren/Teilen
   ========================================================= */


/* ---------------------------------------------------------
   0) Einstellungen
   Trag hier deine WhatsApp-Nummer ein, dann geht der
   "Per WhatsApp schicken"-Button direkt an dich.
   Format: Ländervorwahl ohne + und ohne Leerzeichen,
   z.B. Österreich: '4366012345678'.
   Leer lassen -> WhatsApp fragt, an wen gesendet werden soll.
   --------------------------------------------------------- */
const MEIN_WHATSAPP = '';


/* ---------------------------------------------------------
   1) Hintergrund-Herzen
   --------------------------------------------------------- */
const bgHearts = document.getElementById('bgHearts');
const fxLayer  = document.getElementById('fx') || document.body;   // Ebene fürs Konfetti

const heartPath = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
const heartColors = ['#c0566e', '#cf9a4e', '#d98aa0'];

function heartMarkup(color, filled){
  return filled
    ? `<svg width="26" height="26" viewBox="0 0 24 24" fill="${color}"><path d="${heartPath}"/></svg>`
    : `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6"><path d="${heartPath}"/></svg>`;
}

for(let i = 0; i < 16; i++){
  const h = document.createElement('div');
  h.className = 'floaty';
  const color = heartColors[Math.floor(Math.random() * heartColors.length)];
  h.innerHTML = heartMarkup(color, Math.random() < 0.45);
  h.style.left = Math.random() * 100 + 'vw';
  h.style.transform = `scale(${0.6 + Math.random() * 1.5})`;
  h.style.opacity = (0.14 + Math.random() * 0.16).toFixed(2);
  h.style.animationDuration = (10 + Math.random() * 11) + 's';
  h.style.animationDelay = (-Math.random() * 18) + 's';
  bgHearts.appendChild(h);
}


/* ---------------------------------------------------------
   2) Herz-Konfetti
   --------------------------------------------------------- */
function burst(x, y){
  const cx = x ?? window.innerWidth / 2;
  const cy = y ?? window.innerHeight * 0.42;

  for(let i = 0; i < 28; i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    const color = heartColors[i % heartColors.length];
    const size = 12 + Math.random() * 14;
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><path d="${heartPath}"/></svg>`;
    el.style.left = cx + 'px';
    el.style.top  = cy + 'px';
    fxLayer.appendChild(el);

    const ang  = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 190;
    const dx   = Math.cos(ang) * dist;
    const dy   = Math.sin(ang) * dist - 50;
    const rot  = Math.random() * 720 - 360;
    const dur  = 900 + Math.random() * 900;

    el.animate([
      { transform:'translate(-50%,-50%) scale(.3) rotate(0deg)', opacity:1 },
      { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 170}px)) scale(1) rotate(${rot}deg)`, opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.2,.6,.3,1)' });

    setTimeout(() => el.remove(), dur + 60);
  }
}


/* ---------------------------------------------------------
   3) Der ausweichende "Nein"-Knopf
   --------------------------------------------------------- */
const noBtn  = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const btnRow = yesBtn.parentElement;

let dodgeCount = 0;
let isFixed = false;
let noPlaceholder = null;

function resetNoBtn(){
  noBtn.style.position = '';
  noBtn.style.left = '';
  noBtn.style.top = '';
  noBtn.style.margin = '';
  noBtn.style.zIndex = '';
  noBtn.style.transition = '';
  if(noPlaceholder){ noPlaceholder.remove(); noPlaceholder = null; }
  if(noBtn.parentElement !== btnRow) btnRow.appendChild(noBtn);
  isFixed = false;
}

function flee(){
  const w = noBtn.offsetWidth;
  const h = noBtn.offsetHeight;

  if(!isFixed){
    const r = noBtn.getBoundingClientRect();

    noPlaceholder = document.createElement('span');
    noPlaceholder.style.display = 'inline-block';
    noPlaceholder.style.width  = w + 'px';
    noPlaceholder.style.height = h + 'px';
    btnRow.insertBefore(noPlaceholder, noBtn);

    noBtn.style.transition = 'none';
    noBtn.style.position = 'fixed';
    noBtn.style.margin = '0';
    noBtn.style.zIndex = '9999';
    noBtn.style.left = r.left + 'px';
    noBtn.style.top  = r.top + 'px';
    document.body.appendChild(noBtn);
    noBtn.getBoundingClientRect();
    noBtn.style.transition = '';
    isFixed = true;
  }

  const pad = 16;
  const x = pad + Math.random() * Math.max(0, window.innerWidth  - w - pad - pad);
  const y = pad + Math.random() * Math.max(0, window.innerHeight - h - pad - pad);
  noBtn.style.left = x + 'px';
  noBtn.style.top  = y + 'px';

  dodgeCount++;
  yesBtn.style.transform = `scale(${Math.min(1 + dodgeCount * 0.05, 1.25)})`;
}

noBtn.addEventListener('mouseenter', flee);
noBtn.addEventListener('mousedown',  e => { e.preventDefault(); flee(); });
noBtn.addEventListener('touchstart', e => { e.preventDefault(); flee(); }, { passive:false });


/* ---------------------------------------------------------
   4) Bildschirm-Wechsel
   --------------------------------------------------------- */
function show(id){
  ['ask', 'choose', 'food', 'cal', 'done'].forEach(s => document.getElementById(s).classList.add('hidden'));
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
}


/* ---------------------------------------------------------
   5) Ablauf
   Was die Userin wählt, merken wir uns in diesen Variablen:
     chosenLabel  = z.B. "Kaffee" oder "Essen gehen"
     chosenDetail = nur bei Essen: die Richtung, z.B. "Italienisch"
   --------------------------------------------------------- */
let chosenLabel  = '';
let chosenDetail = '';

// "Ja" gedrückt -> Konfetti + weiter zur Tätigkeits-Auswahl
yesBtn.addEventListener('click', () => {
  const r = yesBtn.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
  resetNoBtn();
  show('choose');
});

// Tätigkeit gewählt
document.querySelectorAll('#choose .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    chosenLabel  = chip.textContent.trim();
    chosenDetail = '';
    // Bei "Essen gehen" (data-sub="food") kommt erst die Richtungs-Auswahl
    if(chip.dataset.sub === 'food'){
      show('food');
    } else {
      buildCalendar();
      show('cal');
    }
  });
});

// Essens-Richtung gewählt -> weiter zum Kalender
document.querySelectorAll('#food .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    chosenDetail = chip.dataset.food;
    buildCalendar();
    show('cal');
  });
});

// "Das passt" -> mit gewähltem Datum abschließen
document.getElementById('confirmDate').addEventListener('click', () => finish(selected));

// "Egal wann" -> ohne festes Datum abschließen
document.getElementById('anytimeBtn').addEventListener('click', () => finish(null));

// Neustart
document.getElementById('restart').addEventListener('click', () => {
  dodgeCount = 0;
  yesBtn.style.transform = '';
  resetNoBtn();
  chosenLabel = '';
  chosenDetail = '';
  viewY = today.getFullYear();
  viewM = today.getMonth();
  selected = new Date(today);
  show('ask');
});


/* ---------------------------------------------------------
   6) Kalender-Logik
   --------------------------------------------------------- */
const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const dows = ['Mo','Di','Mi','Do','Fr','Sa','So'];

const calTitle = document.getElementById('calTitle');
const calDays  = document.getElementById('calDays');
const calDow   = document.getElementById('calDow');
const prevM = document.getElementById('prevM');
const nextM = document.getElementById('nextM');

const today = new Date();
today.setHours(0, 0, 0, 0);

let viewY = today.getFullYear();
let viewM = today.getMonth();
let selected = new Date(today);

dows.forEach(d => {
  const c = document.createElement('div');
  c.className = 'dow';
  c.textContent = d;
  calDow.appendChild(c);
});

const sameDay = (a, b) =>
  a.getFullYear() === b.getFullYear() &&
  a.getMonth()    === b.getMonth() &&
  a.getDate()     === b.getDate();

function buildCalendar(){
  calTitle.textContent = monthNames[viewM] + ' ' + viewY;
  calDays.innerHTML = '';

  const first = new Date(viewY, viewM, 1);
  const offset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(viewY, viewM + 1, 0).getDate();

  for(let i = 0; i < offset; i++){
    const b = document.createElement('div');
    b.className = 'day blank';
    calDays.appendChild(b);
  }

  for(let d = 1; d <= daysInMonth; d++){
    const cur = new Date(viewY, viewM, d);
    const cell = document.createElement('button');
    cell.className = 'day';
    cell.textContent = d;

    if(cur < today){ cell.classList.add('disabled'); cell.disabled = true; }
    if(sameDay(cur, today))    cell.classList.add('today');
    if(sameDay(cur, selected)) cell.classList.add('selected');

    cell.addEventListener('click', () => { selected = cur; buildCalendar(); });
    calDays.appendChild(cell);
  }

  prevM.disabled = (viewY === today.getFullYear() && viewM === today.getMonth());
}

prevM.addEventListener('click', () => { if(viewM === 0){ viewM = 11; viewY--; } else viewM--; buildCalendar(); });
nextM.addEventListener('click', () => { if(viewM === 11){ viewM = 0;  viewY++; } else viewM++; buildCalendar(); });


/* ---------------------------------------------------------
   7) Abschluss: Zusammenfassung + Kopieren/Teilen
   --------------------------------------------------------- */
const summary  = document.getElementById('summary');
const doneText = document.getElementById('doneText');
const copyBtn  = document.getElementById('copyBtn');
const waBtn    = document.getElementById('waBtn');

let shareText = '';   // der Text, der kopiert / geteilt wird

// date = Date-Objekt für ein festes Datum, oder null für "jederzeit"
function finish(date){
  const anytime = !date;

  // Aktivität (ggf. mit Essens-Richtung)
  let activityDisplay = chosenLabel;
  if(chosenDetail) activityDisplay += ` (${chosenDetail})`;

  // Wann
  let whenDisplay;
  if(anytime){
    whenDisplay = 'Jederzeit – passt schon';
  } else {
    const ds = date.toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    whenDisplay = sameDay(date, today) ? `Heute (${ds})` : ds;
  }

  // Zusammenfassung als zwei Zeilen aufbauen
  summary.innerHTML =
    `<div class="sum-row"><span class="sum-label">Aktivität</span><span class="sum-val">${activityDisplay}</span></div>` +
    `<div class="sum-row"><span class="sum-label">Wann</span><span class="sum-val">${whenDisplay}</span></div>`;

  doneText.textContent = 'Ich freu mich auf dich.';

  // Text zum Kopieren / Teilen
  shareText =
    `Ja, ich gehe mit dir aus!\n` +
    `Aktivität: ${activityDisplay}\n` +
    `Wann: ${whenDisplay}`;

  show('done');
  burst();
  setTimeout(() => burst(window.innerWidth * 0.5, window.innerHeight * 0.38), 250);
}

// Text in die Zwischenablage kopieren (mit Fallback für lokale Dateien)
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* unten weiterversuchen */ }

  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){
    return false;
  }
}

copyBtn.addEventListener('click', async () => {
  const ok = await copyText(shareText);
  copyBtn.textContent = ok ? 'Kopiert!' : 'Bitte manuell markieren';
  setTimeout(() => { copyBtn.textContent = 'Infos kopieren'; }, 1800);
});

waBtn.addEventListener('click', () => {
  const base = MEIN_WHATSAPP ? `https://wa.me/${MEIN_WHATSAPP}` : 'https://wa.me/';
  window.open(`${base}?text=${encodeURIComponent(shareText)}`, '_blank');
});
