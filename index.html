<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Eine Frage</title>

  <!-- Schriften von Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Unser eigenes Styling -->
  <link rel="stylesheet" href="styles.css">

  <!-- Unser JavaScript. "defer" sorgt dafür, dass das Script erst läuft,
       wenn das HTML komplett geladen ist (sonst findet es die Elemente nicht). -->
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Hintergrund-Ebene: hier werden per JavaScript die schwebenden Herzen eingefügt -->
  <div id="bgHearts"></div>

  <!-- Effekt-Ebene fürs Konfetti (liegt über allem, wird beschnitten -> keine Scrollbalken) -->
  <div id="fx"></div>

  <!-- Die "Bühne": zentriert den Inhalt auf dem Bildschirm -->
  <div class="stage">
    <div class="card">

      <!-- ====================================================== -->
      <!-- Screen 1: Die Frage                                    -->
      <!-- ====================================================== -->
      <div id="ask" class="fade-in">
        <svg class="flourish" width="210" height="26" viewBox="0 0 260 26" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M8 13 C 52 13 74 5 108 13"/><path d="M8 13 C 18 13 22 7 16 4"/>
          <path d="M252 13 C 208 13 186 5 152 13"/><path d="M252 13 C 242 13 238 7 244 4"/>
          <path d="M130 6.5c-1-1.6-3.1-2.1-4.6-1-1.5 1.1-1.7 3.2-.5 4.6L130 15l5.1-4.9c1.2-1.4 1-3.5-.5-4.6-1.5-1.1-3.6-.6-4.6 1z" fill="currentColor" stroke="none"/>
        </svg>
        <div class="eyebrow">Eine Frage</div>
        <h1>Möchtest du mit mir <span class="accent">ausgehen?</span></h1>
        <div class="btn-row">
          <button class="btn btn-yes" id="yesBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            Ja
          </button>
          <button class="btn btn-no" id="noBtn">Nein</button>
        </div>
      </div>

      <!-- ====================================================== -->
      <!-- Screen 2: Die Tätigkeits-Auswahl                       -->
      <!-- ====================================================== -->
      <div id="choose" class="hidden">
        <svg class="flourish" width="210" height="26" viewBox="0 0 260 26" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M8 13 C 52 13 74 5 108 13"/><path d="M8 13 C 18 13 22 7 16 4"/>
          <path d="M252 13 C 208 13 186 5 152 13"/><path d="M252 13 C 242 13 238 7 244 4"/>
          <path d="M130 6.5c-1-1.6-3.1-2.1-4.6-1-1.5 1.1-1.7 3.2-.5 4.6L130 15l5.1-4.9c1.2-1.4 1-3.5-.5-4.6-1.5-1.1-3.6-.6-4.6 1z" fill="currentColor" stroke="none"/>
        </svg>
        <div class="eyebrow">Schön</div>
        <h1>Auf was hast du <span class="accent">Lust?</span></h1>
        <p class="sub">Such dir aus, was dir am meisten zusagt.</p>
        <!-- data-label = der Text, der später in der Bestätigung auftaucht -->
        <div class="options">
          <button class="chip" data-label="auf einen Kaffee">Kaffee</button>
          <button class="chip" data-label="essen zu gehen" data-sub="food">Essen gehen</button>
          <button class="chip" data-label="auf ein paar Drinks">Drinks</button>
          <button class="chip" data-label="auf einen Spaziergang">Spaziergang</button>
          <button class="chip" data-label="auf einen Kinoabend">Kino</button>
          <button class="chip" data-label="dich überraschen zu lassen">Überrasch mich</button>
        </div>
      </div>

      <!-- ====================================================== -->
      <!-- Screen 2b: Essen-Richtung (nur bei "Essen gehen")      -->
      <!-- ====================================================== -->
      <div id="food" class="hidden">
        <svg class="flourish" width="210" height="26" viewBox="0 0 260 26" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M8 13 C 52 13 74 5 108 13"/><path d="M8 13 C 18 13 22 7 16 4"/>
          <path d="M252 13 C 208 13 186 5 152 13"/><path d="M252 13 C 242 13 238 7 244 4"/>
          <path d="M130 6.5c-1-1.6-3.1-2.1-4.6-1-1.5 1.1-1.7 3.2-.5 4.6L130 15l5.1-4.9c1.2-1.4 1-3.5-.5-4.6-1.5-1.1-3.6-.6-4.6 1z" fill="currentColor" stroke="none"/>
        </svg>
        <div class="eyebrow">Lecker</div>
        <h1>Worauf hast du <span class="accent">Hunger?</span></h1>
        <p class="sub">Wähl eine Richtung – den Rest klären wir dann.</p>
        <!-- data-food = die Richtung, die in der Zusammenfassung landet -->
        <div class="options">
          <button class="chip" data-food="Italienisch">Italienisch</button>
          <button class="chip" data-food="Asiatisch">Asiatisch</button>
          <button class="chip" data-food="Burger">Burger</button>
          <button class="chip" data-food="Sushi">Sushi</button>
          <button class="chip" data-food="Vegetarisch">Vegetarisch</button>
          <button class="chip" data-food="Überrasch mich">Überrasch mich</button>
        </div>
      </div>

      <!-- ====================================================== -->
      <!-- Screen 3: Der Kalender                                 -->
      <!-- ====================================================== -->
      <div id="cal" class="hidden">
        <svg class="flourish" width="210" height="26" viewBox="0 0 260 26" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M8 13 C 52 13 74 5 108 13"/><path d="M8 13 C 18 13 22 7 16 4"/>
          <path d="M252 13 C 208 13 186 5 152 13"/><path d="M252 13 C 242 13 238 7 244 4"/>
          <path d="M130 6.5c-1-1.6-3.1-2.1-4.6-1-1.5 1.1-1.7 3.2-.5 4.6L130 15l5.1-4.9c1.2-1.4 1-3.5-.5-4.6-1.5-1.1-3.6-.6-4.6 1z" fill="currentColor" stroke="none"/>
        </svg>
        <div class="eyebrow">Fast geschafft</div>
        <h1>Wann <span class="accent">passt</span> es dir?</h1>
        <div class="calendar">
          <div class="cal-head">
            <button class="cal-nav" id="prevM" aria-label="Vorheriger Monat">&#8249;</button>
            <div class="cal-title" id="calTitle"></div>
            <button class="cal-nav" id="nextM" aria-label="Nächster Monat">&#8250;</button>
          </div>
          <!-- Wochentags-Kopfzeile (wird per JS gefüllt) -->
          <div class="cal-grid cal-dow" id="calDow"></div>
          <!-- Die eigentlichen Tage (werden per JS gefüllt) -->
          <div class="cal-grid" id="calDays"></div>
        </div>
        <div class="cal-actions">
          <button class="btn btn-yes" id="confirmDate">Das passt</button>
          <button class="anytime" id="anytimeBtn">Egal wann, jederzeit möglich</button>
        </div>
      </div>

      <!-- ====================================================== -->
      <!-- Screen 4: Die Bestätigung                              -->
      <!-- ====================================================== -->
      <div id="done" class="hidden">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <h1>Perfekt.</h1>
        <p class="sub" id="doneText">Ich freu mich auf dich.</p>

        <!-- Zusammenfassung (wird per JS gefüllt) -->
        <div class="summary" id="summary"></div>

        <div class="done-actions">
          <button class="btn btn-yes" id="copyBtn">Infos kopieren</button>
          <button class="anytime" id="waBtn">Per WhatsApp schicken</button>
        </div>

        <button class="restart" id="restart">nochmal von vorn</button>
      </div>

    </div>
  </div>

</body>
</html>
